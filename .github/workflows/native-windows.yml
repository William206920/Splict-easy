name: Native Windows application

on:
  push:
    branches: [main]
    paths-ignore: ['docs/**', '*.md']
  pull_request:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned MoonBit stable
        shell: pwsh
        run: |
          $env:MOONBIT_INSTALL_VERSION = (Get-Content toolchain.version -Raw).Trim()
          Invoke-RestMethod https://cli.moonbitlang.com/install/powershell.ps1 | Invoke-Expression
          "$env:USERPROFILE\.moon\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Format, native build and Windows integration
        shell: pwsh
        run: |
          moon fmt --check
          if ($LASTEXITCODE -ne 0) { throw 'Format check failed.' }
          ./scripts/build-windows.ps1 -Smoke
      - name: Package and verify installer
        shell: pwsh
        run: |
          ./scripts/package-windows.ps1
          ./scripts/verify-installer.ps1
          ./scripts/capture-demo.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: SplitEasy-Windows
          path: |
            dist/package/*
            dist/dependencies.txt
          if-no-files-found: error

  publish:
    if: github.event_name == 'release'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: SplitEasy-Windows
          path: release-files
      - name: Verify version and publish tested binaries
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        shell: bash
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          cd release-files/package
          test -f "SplitEasy-$version-Windows-x64-Setup.exe"
          test -f "SplitEasy-$version-Windows-x64-Portable.zip"
          sha256sum --check SHA256SUMS.txt
          gh release upload "$RELEASE_TAG" "SplitEasy-$version-Windows-x64-Setup.exe" "SplitEasy-$version-Windows-x64-Portable.zip" SHA256SUMS.txt preview*.png
