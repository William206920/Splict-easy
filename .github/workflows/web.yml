name: MoonBit online application
on:
  push:
    branches: [main]
    paths-ignore: ['docs/**', '*.md']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: online-${{ github.ref }}
  cancel-in-progress: true
jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Guard MoonBit source share above 65 percent
        run: node scripts/check-language-share.mjs
      - name: Install pinned MoonBit
        run: |
          export MOONBIT_INSTALL_VERSION="$(cat toolchain.version)"
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
      - name: Check, rebuild MoonBit and verify generated artifact
        run: |
          moon fmt --check
          moon check --target js
          moon test --target js
          node scripts/build-web.mjs --compile
          git diff --exit-code -- web/generated
      - name: Gateway and browser bridge regression tests
        run: node --test tests/web.test.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: SplitEasy-Online
          path: .web-dist/
          include-hidden-files: true
          if-no-files-found: error
      - name: Build GitHub Pages frontend
        run: node scripts/build-web.mjs --pages
      - uses: actions/upload-pages-artifact@v4
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          path: .web-dist
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: web
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - uses: actions/deploy-pages@v4
        id: deployment
